[package]
name = "nemue"
version = "0.1.0"
edition = "2021"
authors = ["Nemue Project"]
description = "A high-performance network scanner designed to surpass Nmap"
license = "MIT"
repository = "https://github.com/tabea/Nemue"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pnet = "0.34"
pnet_packet = "0.34"
futures = "0.3"
async-trait = "0.1"
ipnetwork = "0.20"
chrono = { version = "0.4", features = ["serde"] }
governor = "0.6"  # Rate limiting
colored = "2.1"  # Terminal colors
indicatif = "0.17"  # Progress bars
rand = "0.8"  # Random number generation
mlua = { version = "0.9", features = ["lua54", "async", "send", "vendored"] }  # Lua scripting engine (vendored)
actix-web = "4.4"  # REST API server
actix-cors = "0.7"  # CORS middleware
uuid = { version = "1.6", features = ["v4", "serde"] }  # Unique scan IDs

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"

[[bin]]
name = "nemue"
path = "src/main.rs"

[lib]
name = "nemue"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
