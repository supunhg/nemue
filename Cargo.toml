[package]
name = "nemue"
version = "0.2.0"
edition = "2021"
authors = ["Nemue Project"]
description = "Advanced security testing framework with network scanning, web fuzzing, and scripting"
license = "MIT"
repository = "https://github.com/tabea/Nemue"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
quick-xml = { version = "0.31", features = ["serialize"] }
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
pnet = "0.34"
pnet_packet = "0.34"
futures = "0.3"
async-trait = "0.1"
ipnetwork = "0.20"
chrono = { version = "0.4", features = ["serde"] }
governor = "0.6"  # Rate limiting
colored = "2.1"  # Terminal colors
indicatif = "0.17"  # Progress bars
rand = "0.8"  # Random number generation
mlua = { version = "0.9", features = ["lua54", "async", "send", "vendored"] }  # Lua scripting engine (vendored)
actix-web = "4.4"  # REST API server
actix-web-actors = "4.2"  # WebSocket actor support
actix = "0.13"  # Actor framework
actix-cors = "0.7"  # CORS middleware
uuid = { version = "1.6", features = ["v4", "serde"] }  # Unique scan IDs
reqwest = { version = "0.11", features = ["json"] }  # HTTP client for fuzzing
regex = "1.10"  # Regular expressions
url = "2.5"  # URL parsing
lazy_static = "1.4"  # Static initialization
crossbeam = "0.8"  # Lock-free data structures
num_cpus = "1.16"  # CPU count for parallelism
rmcp = { version = "0.16", features = ["server"] }  # MCP server support
toml = "0.8"  # Config file parsing
dirs = "5"  # XDG directory paths
printpdf = "0.5"  # PDF report generation
flate2 = "1.0"  # gzip compression
zstd = "0.13"  # zstd compression
aes-gcm = "0.10"  # AES-256-GCM encryption

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.12"
tempfile = "3.8"  # Temporary files for testing
criterion = { version = "0.5", features = ["html_reports"] }  # Benchmarking framework

[[bench]]
name = "scanner_benchmarks"
harness = false

[[bin]]
name = "nemue"
path = "src/main.rs"

[lib]
name = "nemue"
path = "src/lib.rs"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
